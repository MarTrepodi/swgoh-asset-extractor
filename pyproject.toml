[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swgoh-asset-extractor"
version = "0.1.0"
description = "Cross-platform GUI tool for extracting game assets from SWGOH Unity bundles"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "UnityPy>=1.10",
    "protobuf>=4.0",
    "Pillow>=10.0",
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "pyinstaller>=6.0",
    "ruff>=0.1",
    "grpcio-tools>=1.60",
]

[project.scripts]
swgoh-asset-extractor = "swgoh_asset_extractor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
